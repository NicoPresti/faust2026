  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

tensteigerung bei neuem Publikum. Programmverteiler (PV): Anzeigen zur gezielten Ansprache der Custom Audience für den Ticketkauf.<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 2. TICKETKAUF -->\n  <div style=\"background:#fff;\">\n  <div id=\"ticketkauf\" style=\"max-width:1100px; margin:0 auto; padding:80px clamp(16px,5vw,32px);\">\n    <div style=\"font-size:13px; font-weight:700; color:#a11d38; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:6px;\">02<\u002Fdiv>\n    <h3 style=\"font-family:'Goetheanum Deutlich','Goetheanum',Georgia,serif; font-weight:700; font-size:clamp(22px,4.5vw,30px); color:#241017; margin:0 0 4px;\">Von der Webseite zum Ticketkauf<\u002Fh3>\n    <div style=\"color:#8a8a8a; font-size:14.5px; margin-bottom:32px;\">Webseiten-Traffic und Pretix-Kampagnenergebnisse<\u002Fdiv>\n\n    <!-- funnel -->\n    <div id=\"ticketkauf-grid\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:16px; margin-bottom:32px;\">\n      <div style=\"background:#f4eeee; border-radius:6px; padding:22px 20px; text-align:center;\">\n        <div style=\"font-size:27px; font-weight:700;\">22'566<\u002Fdiv>\n        <div style=\"font-size:13.5px; font-weight:600; margin-top:5px;\">Einzelbesucher Webseite<\u002Fdiv>\n        <div style=\"font-size:12px; color:#8a8a8a;\">+213 % ggü. Vorjahreszeitraum<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#f4eeee; border-radius:6px; padding:22px 20px; text-align:center;\">\n        <div style=\"font-size:27px; font-weight:700;\">7'992<\u002Fdiv>\n        <div style=\"font-size:13.5px; font-weight:600; margin-top:5px;\">Pretix-Kampagnenlink-Klicks<\u002Fdiv>\n        <div style=\"font-size:12px; color:#8a8a8a;\">+106 % ggü. 2025 (3'878)<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#f4eeee; border-radius:6px; padding:22px 20px; text-align:center;\">\n        <div style=\"font-size:27px; font-weight:700;\">4<\u002Fdiv>\n        <div style=\"font-size:13.5px; font-weight:600; margin-top:5px;\">Pretix bezahlte Bestellungen<\u002Fdiv>\n        <div style=\"font-size:12px; color:#8a8a8a;\">über den Kampagnenlink<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-weight:700; font-size:15px; margin:0 0 16px; color:#5a4a4d;\">Webseite und Pretix im Vergleich<\u002Fdiv>\n    <div style=\"display:flex; align-items:flex-end; gap:28px; height:190px; padding:0 4px; margin:0 auto 8px; max-width:460px;\">\n      <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:flex-end; flex:1; height:100%;\">\n        <div style=\"font-size:14px; font-weight:700; margin-bottom:4px;\">22'566<\u002Fdiv>\n        <div style=\"width:100%; max-width:80px; height:180px; background:#2e1620; border-radius:3px 3px 0 0;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:flex-end; flex:1; height:100%;\">\n        <div style=\"font-size:14px; font-weight:700; margin-bottom:4px;\">8'747<\u002Fdiv>\n        <div style=\"width:100%; max-width:80px; height:70px; background:#5a3d42; border-radius:3px 3px 0 0;\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; align-items:center; justify-content:flex-end; flex:1; height:100%;\">\n        <div style=\"font-size:14px; font-weight:700; margin-bottom:4px;\">7'992<\u002Fdiv>\n        <div style=\"width:100%; max-width:80px; height:64px; background:#a11d38; border-radius:3px 3px 0 0;\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; gap:28px; margin:0 auto 36px; max-width:460px;\">\n      <div style=\"flex:1; text-align:center; font-size:12.5px; color:#8a8a8a;\">Einzelne Besuche<\u002Fdiv>\n      <div style=\"flex:1; text-align:center; font-size:12.5px; color:#8a8a8a;\">Meta Klicks (insgesamt)<\u002Fdiv>\n      <div style=\"flex:1; text-align:center; font-size:12.5px; color:#8a8a8a;\">Pretix Klicks<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-weight:700; font-size:15px; margin:0 0 16px; color:#5a4a4d;\">Webseite: Besuche nach Monat 2026<\u002Fdiv>\n    <img src=\"604b6fb5-d582-4226-96a1-e9a161040ccb\" alt=\"Webseite: Besuche nach Monat 2026\" style=\"width:100%; max-width:680px; display:block; margin:0 auto 36px;\">\n\n    <div style=\"border:1px solid #ecdfe1; border-radius:6px; overflow:hidden; margin-bottom:14px;\">\n      <sc-raw-table style=\"width:100%; border-collapse:collapse; font-size:14px;\">\n        <sc-raw-tr>\n          <sc-raw-th style=\"text-align:left; background:#8a7175; color:#fff; padding:8px 14px; font-size:12.5px; font-weight:600;\">Klicks<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:left; background:#8a7175; color:#fff; padding:8px 14px; font-size:12.5px; font-weight:600;\">bezahlte Bestellungen<\u002Fsc-raw-th>\n          <sc-raw-th style=\"text-align:left; background:#8a7175; color:#fff; padding:8px 14px; font-size:12.5px; font-weight:600;\">Umsatz bezahlt<\u002Fsc-raw-th>\n        <\u002Fsc-raw-tr>\n        <sc-raw-tr><sc-raw-td style=\"padding:8px 14px;\">7'992<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;\">4<\u002Fsc-raw-td><sc-raw-td style=\"padding:8px 14px;\">CHF 1'100<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n    <div style=\"font-size:12.5px; color:#8a7175; background:#fbf0f1; border-left:3px solid #a11d38; padding:10px 16px; border-radius:0 4px 4px 0;\">Diese Zahlen bilden nur Käufe über den einen getrackten Pretix-Link ab. Sie sind eine bekannte Untererfassung (z.&nbsp;B. durch In-App-Browser ohne Referrer-Weitergabe und Gerätewechsel Mobile&nbsp;→&nbsp;Desktop) – kein Mass für den tatsächlichen Verkaufserfolg. Siehe Abschnitt 3 für den Gesamtverkauf.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <!-- 3. VERKAUF -->\n  <div id=\"verkauf\" style=\"border-top:1px solid #ecdfe1; border-bottom:1px solid #ecdfe1;\">\n  <div style=\"max-width:1100px; margin:0 auto; padding:80px clamp(16px,5vw,32px);\">\n    <div style=\"font-size:13px; font-weight:700; color:#a11d38; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:6px;\">03<\u002Fdiv>\n    <h3 style=\"font-family:'Goetheanum Deutlich','Goetheanum',Georgia,serif; font-weight:700; font-size:clamp(22px,4.5vw,30px); color:#241017; margin:0 0 32px;\">Verkauf Januar bis Juli und Wachstum ab Meta-Kampagne<\u002Fh3>\n\n    <div id=\"verkauf-grid\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:36px;\">\n      <div style=\"background:#f4eeee; border-radius:6px; padding:20px; text-align:center;\">\n        <div style=\"font-size:25px; font-weight:700;\">881<\u002Fdiv>\n        <div style=\"font-size:14px; font-weight:600; margin-top:5px;\">Ticketverkauf vor Kampagne<\u002Fdiv>\n        <div style=\"font-size:12px; color:#8a8a8a;\">Jan–Apr, Ø 220/Monat<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#f4eeee; border-radius:6px; padding:20px; text-align:center;\">\n        <div style=\"font-size:25px; font-weight:700;\">1'233<\u002Fdiv>\n        <div style=\"font-size:14px; font-weight:600; margin-top:5px;\">Ticketverkauf während Kampagne<\u002Fdiv>\n        <div style=\"font-size:12px; color:#8a8a8a;\">Mai–Jul, Ø 411/Monat<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-weight:700; font-size:15px; margin:0 0 16px; color:#5a4a4d;\">Ticketverkauf Jan.–Jul. 2026<\u002Fdiv>\n    <img id=\"chart-bleed-4\" src=\"ce50c989-e9eb-4a8c-97b5-6f65a456a1f0\" alt=\"Ticketverkauf Jan-Jul 2026\" style=\"width:100%; max-width:820px; display:block; margin:0 auto 36px;\">\n\n    <div style=\"background:#a11d38; color:#fff; border-radius:6px; padding:26px 30px;\">\n      <div style=\"font-size:26px; font-weight:700;\">+87 %<\u002Fdiv>\n      <div style=\"font-size:15px; font-weight:600; margin-top:3px;\">Ticketverkauf zieht mit Kampagnenstart deutlich an<\u002Fdiv>\n      <div style=\"font-size:13.5px; margin-top:10px; color:#f7e3e7; line-height:1.6; max-width:760px;\">Im Kampagnenzeitraum (Mai–Juli) wurden im Schnitt 411 Tickets pro Monat verkauft, gegenüber 220 in den vier Monaten davor. Im Jahresvergleich liegt der Gesamtverkauf 2026 dennoch unter 2025 – die Details dazu unter \"Kernerkenntnisse\".<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- 4. ERKENNTNISSE -->\n  <div style=\"background:#fff;\">\n  <div id=\"erkenntnisse\" style=\"max-width:1100px; margin:0 auto; padding:80px clamp(16px,5vw,32px) 96px;\">\n    <div style=\"font-size:13px; font-weight:700; color:#a11d38; letter-spacing:0.06em; text-transform:uppercase; margin-bottom:6px;\">04<\u002Fdiv>\n    <h3 style=\"font-family:'Goetheanum Deutlich','Goetheanum',Georgia,serif; font-weight:700; font-size:clamp(22px,4.5vw,30px); color:#241017; margin:0 0 32px;\">Kernerkenntnisse<\u002Fh3>\n\n    <div id=\"erkenntnisse-grid\" style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:24px 40px;\">\n      <div style=\"border-top:2px solid #a11d38; padding-top:14px;\">\n        <div style=\"font-size:16.5px; font-weight:700; color:#241017;\">Reichweite und Bekanntheit – das erste Ziel – wurde klar erreicht<\u002Fdiv>\n        <div style=\"margin-top:6px; font-size:14px; color:#4a4144; line-height:1.65;\">183'930 erreichte Personen, +221&nbsp;% Website-Traffic gegenüber Vorjahr, doppelt so viele Pretix-Klicks wie 2025 in weniger als einem Viertel der Laufzeit. Die strukturierte Zielgruppenansprache (Publikumsmagnet/Programmverteiler, Custom Audience, Instant Experience) hat spürbar mehr Menschen auf Faust aufmerksam gemacht.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #a11d38; padding-top:14px;\">\n        <div style=\"font-size:16.5px; font-weight:700; color:#241017;\">Erstmals eine wiederverwendbare Zielgruppe für 2027 aufgebaut<\u002Fdiv>\n        <div style=\"margin-top:6px; font-size:14px; color:#4a4144; line-height:1.65;\">Über die Instant Experience wurde eine eigene Faust Custom Audience von 1'700–2'000 Personen aufgebaut, die aktiv mit der Kampagne interagiert haben. Diese Grösse liegt über der von Meta empfohlenen Mindestgrösse für wirksame Lookalike-Zielgruppen (~1'000) und kann 2027 direkt für gezieltes Retargeting genutzt werden – ein strategisches Asset, das es 2025 in dieser Form noch nicht gab.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #a11d38; padding-top:14px;\">\n        <div style=\"font-size:16.5px; font-weight:700; color:#241017;\">Ticketverkauf zieht mit Kampagnenstart deutlich an<\u002Fdiv>\n        <div style=\"margin-top:6px; font-size:14px; color:#4a4144; line-height:1.65;\">Im Kampagnenzeitraum (Mai–Juli) wurden im Schnitt 411 Tickets pro Monat verkauft, gegenüber 220 in den vier Monaten davor – ein Anstieg von 87&nbsp;%. Im Jahresvergleich liegt der Gesamtverkauf 2026 dennoch unter 2025 (2'114 vs. 3'397 Tickets), vor allem weil deutlich mehr kleinere Bestellungen aufgegeben wurden, nicht weil die Kampagne selbst schwächer performt hat.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #a11d38; padding-top:14px;\">\n        <div style=\"font-size:16.5px; font-weight:700; color:#241017;\">Die ‹4 Bestellungen› sind eine Tracking-Lücke, kein Ergebnis<\u002Fdiv>\n        <div style=\"margin-top:6px; font-size:14px; color:#4a4144; line-height:1.65;\">Nur Käufe über den einen fest verlinkten Pretix-Button werden diesem Wert zugerechnet. Zwei plausible Gründe für die Untererfassung: In-App-Browser von Instagram/Facebook unterdrücken oft den Referrer, wodurch Social-Traffic in der Website-Analyse fälschlich als ‹Direkt› erscheint. Zusätzlich kaufen viele Interessierte ein hochpreisiges Ticket vermutlich erst später an einem anderen Gerät, ohne dabei den getrackten Link nochmals zu verwenden. Durchgängiges UTM-Tracking über alle Geräte hinweg wäre der wichtigste nächste Schritt zur Professionalisierung.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #a11d38; padding-top:14px;\">\n        <div style=\"font-size:16.5px; font-weight:700; color:#241017;\">Hohe Wiederholungsrate bei kleinen Zielgruppen zeigt echtes Vertiefungspotenzial<\u002Fdiv>\n        <div style=\"margin-top:6px; font-size:14px; color:#4a4144; line-height:1.65;\">Bei eng gefassten Custom-Audience-Anzeigen wurde einzelnen Personen die Anzeige bis zu 15-mal gezeigt (Ø Frequenz gesamt: 3,56) – ein Zeichen für wiederkehrendes Interesse in dieser Gruppe. Für künftige Kampagnen lohnt sich, gezielt mehr Budget in die Vertiefung bei mehrfach engagierten Personen zu stecken, statt vorrangig auf neue Reichweite zu setzen.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #a11d38; padding-top:14px;\">\n        <div style=\"font-size:16.5px; font-weight:700; color:#241017;\">Budget lag leicht über Plan<\u002Fdiv>\n        <div style=\"margin-top:6px; font-size:14px; color:#4a4144; line-height:1.65;\">3'022,89 CHF gegenüber 2'800 CHF geplant – eine Überschreitung von rund 8&nbsp;%, bedingt durch eine etwas längere Laufzeit einzelner Anzeigen gegen Ende der Kampagne.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #a11d38; padding-top:14px;\">\n        <div style=\"font-size:16.5px; font-weight:700; color:#241017;\">Regionale Klicks sind wertvoller als überregionale<\u002Fdiv>\n        <div style=\"margin-top:6px; font-size:14px; color:#4a4144; line-height:1.65;\">Regionale und überregionale Zielgruppen hatten ähnliche Klickraten (je 1,38&nbsp;%) – aber ein Klick aus der Region führt wahrscheinlich deutlich öfter zu einem tatsächlichen Ticketkauf, da Anreise und Ticketpreis für Personen vor Ort eine geringere Hürde sind. Für 2027 lohnt sich eine stärkere Gewichtung der regionalen Zielgruppe.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"border-top:1px solid #ecdfe1; padding:24px clamp(16px,5vw,32px); text-align:center; font-size:12px; color:#9a9a9a;\">Goetheanum · FAUST 2026 · Abschlussbericht Meta-Kampagne, Stand 16. August 2026<\u002Fdiv>\n  <\u002Fdiv>\n\n\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  navLogoRef = React.createRef();\n  state = { menuOpen: false, scrolled: false, isMobile: false };\n\n  componentDidMount() {\n    this.mq = window.matchMedia('(max-width:680px)');\n    this.setState({ isMobile: this.mq.matches });\n    this.onMqChange = (e) => this.setState({ isMobile: e.matches });\n    this.mq.addEventListener ? this.mq.addEventListener('change', this.onMqChange) : this.mq.addListener(this.onMqChange);\n\n    this.onScroll = () => {\n      const target = document.getElementById('reichweite');\n      const logoThreshold = target ? target.offsetTop - 80 : 300;\n      if (this.navLogoRef.current) {\n        this.navLogoRef.current.style.height = window.scrollY > logoThreshold ? '39px' : '51px';\n      }\n      const scrolled = window.scrollY > 16;\n      if (scrolled !== this.state.scrolled) this.setState({ scrolled });\n    };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    this.onScroll();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('scroll', this.onScroll);\n    this.mq.removeEventListener ? this.mq.removeEventListener('change', this.onMqChange) : this.mq.removeListener(this.onMqChange);\n  }\n\n  renderVals() {\n    const { menuOpen, scrolled, isMobile } = this.state;\n    const hideLinks = isMobile && scrolled;\n    return {\n      navLogoRef: this.navLogoRef,\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      navLinksStyle: `display:${hideLinks ? 'none' : 'flex'}; gap:${isMobile ? '16px' : '22px'}; flex-wrap:${isMobile ? 'nowrap' : 'wrap'}; overflow-x:${isMobile ? 'auto' : 'visible'};`,\n      navToggleStyle: `display:${hideLinks ? 'inline-flex' : 'none'}; background:none; border:none; font-size:22px; color:#241017; cursor:pointer; padding:4px 6px; line-height:1;`,\n      mobileMenuStyle: `position:absolute; top:100%; left:0; right:0; background:#faf6f4; border-bottom:1px solid #ecdfe1; flex-direction:column; padding:14px clamp(16px,5vw,32px) 20px; gap:16px; z-index:19; display:${menuOpen ? 'flex' : 'none'};`\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fdiv><\u002Fx-dc><\u002Fbody><\u002Fhtml>"
  </script>
